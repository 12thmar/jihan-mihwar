name: Deploy to EC2

on:
  push:
    branches: [ "prod" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: true

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: BREVO_API_KEY,BREVO_SENDER_EMAIL,JIHAN_EMAIL
          script: |
            set -e

            # Write .env from GitHub secrets
            cat > /home/ec2-user/jihan-mihwar.env << EOF
            BREVO_API_KEY=$BREVO_API_KEY
            BREVO_SENDER_EMAIL=$BREVO_SENDER_EMAIL
            JIHAN_EMAIL=$JIHAN_EMAIL
            EOF

            # Pull latest code
            cd /home/ec2-user/jihan-mihwar
            git pull origin main

            # Build new image
            docker build -t jihan-mihwar .

            # Swap container with zero-downtime restart
            docker stop jihan-mihwar 2>/dev/null || true
            docker rm   jihan-mihwar 2>/dev/null || true
            docker run -d \
              --name jihan-mihwar \
              --restart unless-stopped \
              --env-file /home/ec2-user/jihan-mihwar.env \
              -p 8080:8080 \
              jihan-mihwar

            # Health check
            sleep 3
            curl -sf http://localhost:8080/health || exit 1
            echo "Deploy complete"
