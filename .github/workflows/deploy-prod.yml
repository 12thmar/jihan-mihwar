name: Deploy to EC2

on:
  push:
    branches: [ "prod" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: true

    steps:
      - name: Verify secrets are set
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          JIHAN_EMAIL: ${{ secrets.JIHAN_EMAIL }}
        run: |
          missing=()
          [ -z "$BREVO_API_KEY" ]     && missing+=("BREVO_API_KEY")
          [ -z "$BREVO_SENDER_EMAIL" ] && missing+=("BREVO_SENDER_EMAIL")
          [ -z "$JIHAN_EMAIL" ]       && missing+=("JIHAN_EMAIL")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing secrets: ${missing[*]}"
            echo "Go to GitHub repo Settings -> Secrets -> Actions and add them."
            exit 1
          fi
          echo "All 3 Brevo secrets are set"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          JIHAN_EMAIL: ${{ secrets.JIHAN_EMAIL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: BREVO_API_KEY,BREVO_SENDER_EMAIL,JIHAN_EMAIL
          script: |
            set -e

            # Pull latest code
            cd /home/ec2-user/jihan-mihwar
            git pull origin main

            # Build new image
            docker build -t jihan-mihwar .

            # Swap container with zero-downtime restart
            docker stop jihan-mihwar 2>/dev/null || true
            docker rm   jihan-mihwar 2>/dev/null || true
            docker run -d \
              --name jihan-mihwar \
              --restart unless-stopped \
              -e BREVO_API_KEY="$BREVO_API_KEY" \
              -e BREVO_SENDER_EMAIL="$BREVO_SENDER_EMAIL" \
              -e JIHAN_EMAIL="$JIHAN_EMAIL" \
              -p 8080:8080 \
              jihan-mihwar

            # Health check
            sleep 3
            curl -sf http://localhost:8080/health || exit 1
            echo "Deploy complete"
